name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DeskFolders.slnx -c Release

      - name: Test
        run: dotnet test DeskFolders.slnx -c Release --no-build

      - name: Publish single exe
        run: dotnet publish src/DeskFolders/DeskFolders.csproj -p:PublishProfile=win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: DeskFolders-win-x64
          path: artifacts/publish/DeskFolders.exe
          if-no-files-found: error
