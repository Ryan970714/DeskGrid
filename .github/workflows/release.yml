# Pushing a tag like v0.1.0 builds, tests and publishes a GitHub Release with the single exe.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test DeskFolders.slnx -c Release

      - name: Publish single exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/DeskFolders/DeskFolders.csproj -p:PublishProfile=win-x64 -p:Version=$version
          $asset = "artifacts/DeskFolders-$version-win-x64.exe"
          Move-Item artifacts/publish/DeskFolders.exe $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $asset -Leaf) | Set-Content "$asset.sha256" -Encoding ascii
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' $env:ASSET "$env:ASSET.sha256" --title '${{ github.ref_name }}' --generate-notes
